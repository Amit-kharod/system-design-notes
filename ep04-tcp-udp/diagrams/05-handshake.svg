<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="639" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">The three-way handshake on the real example (the starting numbers 1000 and 5000 are made easy)</text><g class="box"><rect x="100" y="66" width="200" height="48" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="200.0" y="86.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Phone</text><text x="200.0" y="106.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">192.168.1.5</text></g><g class="box"><rect x="660" y="66" width="200" height="48" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="760.0" y="86.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">i.instagram.com</text><text x="760.0" y="106.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">57.144.x.x</text></g><line x1="200" y1="118" x2="200" y2="540" stroke="#6b7a94" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="760" y1="118" x2="760" y2="540" stroke="#6b7a94" stroke-width="1.6" stroke-dasharray="4 4"/><g class="box"><rect x="250" y="128" width="460" height="26" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="480.0" y="145.14" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">FROM 192.168.1.5:51000 · TO 57.144.x.x:443</text></g><g class="box"><rect x="250" y="160" width="460" height="26" rx="6" fill="#e6f4fc" stroke="#2f6fa8" stroke-width="1.4"/><text x="480.0" y="177.14" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">SYN · SEQ 1000 · DATA empty</text></g><line x1="204" y1="202" x2="756" y2="234" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="30" y="220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#2f6fa8" text-anchor="start" xml:space="preserve">step 1</text><g class="box"><rect x="250" y="262" width="460" height="26" rx="6" fill="#ffffff" stroke="#e3262c" stroke-width="1.4"/><text x="480.0" y="279.14" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">FROM 57.144.x.x:443 · TO 192.168.1.5:51000</text></g><g class="box"><rect x="250" y="294" width="460" height="26" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="480.0" y="311.14" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">SYN ACK · SEQ 5000 · ACK 1001</text></g><line x1="756" y1="336" x2="204" y2="368" stroke="#e3262c" stroke-width="2" marker-end="url(#ae3262c)"/><text x="30" y="354" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="start" xml:space="preserve">step 2</text><g class="box"><rect x="250" y="396" width="460" height="26" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="480.0" y="413.14" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">FROM 192.168.1.5:51000 · TO 57.144.x.x:443</text></g><g class="box"><rect x="250" y="428" width="460" height="26" rx="6" fill="#e6f4fc" stroke="#2f6fa8" stroke-width="1.4"/><text x="480.0" y="445.14" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ACK · SEQ 1001 · ACK 5001</text></g><line x1="204" y1="470" x2="756" y2="502" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="30" y="488" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#2f6fa8" text-anchor="start" xml:space="preserve">step 3</text><text x="30" y="566" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a2640" text-anchor="start" xml:space="preserve">Now both sides know each other's starting number, and both have confirmed it: a TCP connection exists.</text><text x="30" y="594" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">ACK 1001 = "I got your 1000, the next byte I need is 1001".  The message is in none of the three segments.</text><text x="30" y="618" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">Cost: one full round trip passes before the first byte of the message can go.</text><path d="M 830 190 V 520" fill="none" stroke="#e3262c" stroke-width="2" stroke-dasharray="6 5"/><text x="842" y="350" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">1 round</text><text x="842" y="368" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">trip</text></svg>
