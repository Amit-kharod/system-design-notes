<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="619" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">A lost segment: ACK 1011 again and again, then the resend</text><g class="box"><rect x="40" y="66" width="170" height="44" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="125.0" y="92.68" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Phone (sender)</text></g><g class="box"><rect x="750" y="66" width="170" height="44" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="835.0" y="92.68" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Server (receiver)</text></g><line x1="214" y1="160" x2="746" y2="160" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480.0" y="152.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">segment 1 · SEQ 1001 · "Kal 5 baje"</text><line x1="746" y1="192" x2="214" y2="192" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480.0" y="184.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">ACK 1011  "got up to 1010, send 1011"</text><line x1="214" y1="246" x2="520" y2="246" stroke="#e3262c" stroke-width="2" marker-end="url(#ae3262c)"/><text x="367.0" y="238.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">segment 2 · SEQ 1011 · " CP pe mil"</text><text x="560" y="251" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#e3262c" text-anchor="start" xml:space="preserve">X  lost</text><text x="580" y="278" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">no ACK is sent</text><line x1="214" y1="332" x2="746" y2="332" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480.0" y="324.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">segment 3 · SEQ 1021 · "te hain :)"</text><line x1="746" y1="364" x2="214" y2="364" stroke="#e3262c" stroke-width="2" marker-end="url(#ae3262c)"/><text x="480.0" y="356.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">ACK 1011  duplicate: "still waiting for 1011"</text><line x1="214" y1="418" x2="746" y2="418" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480.0" y="410.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">segment 2 sent again · SEQ 1011</text><line x1="746" y1="450" x2="214" y2="450" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480.0" y="442.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">ACK 1031  "all of 1001 to 1030 received"</text><text x="30" y="492" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="start" xml:space="preserve">Three extra copies of ACK 1011 make the phone resend at once (fast retransmit). A timer does the same if no ACK comes in time.</text><text x="30" y="520" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">In this tiny message only one duplicate appears; in a long message every segment behind the lost one brings another.</text><text x="30" y="546" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The server keeps segment 3 on the side and cannot hand "te hain :)" to the app yet: that wait is head-of-line blocking.</text><text x="30" y="572" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Like a toll plaza: one car stuck at the front holds up every car behind it.</text></svg>
