x="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="170.0" y="185.32" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">YouTube     port 52000</text></g><g class="box"><rect x="50" y="206" width="240" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="170.0" y="225.32" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">WhatsApp    port 53000</text></g><rect x="650" y="84" width="280" height="190" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="668" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">i.instagram.com  57.144.x.x</text><g class="box"><rect x="670" y="126" width="240" height="30" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="790.0" y="145.32" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">HTTPS (Instagram)  port 443</text></g><g class="box"><rect x="670" y="166" width="240" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="790.0" y="185.32" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">HTTP               port 80</text></g><line x1="294" y1="141" x2="646" y2="141" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="470" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">one packet</text><text x="30" y="306" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The IP address brings the packet to the right device. The port brings it to the right app inside.</text><g class="box"><rect x="30" y="322" width="900" height="62" rx="10" fill="#ffffff" stroke="#e3262c" stroke-width="1.6"/><text x="48" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">The four numbers of this connection:</text><text x="48" y="372" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#243352" font-weight="700">192.168.1.5</tspan><tspan fill="#6b7a94" font-weight="700"> : </tspan><tspan fill="#e3262c" font-weight="700">51000</tspan><tspan fill="#6b7a94" font-weight="700">   to   </tspan><tspan fill="#243352" font-weight="700">i.instagram.com (57.144.x.x)</tspan><tspan fill="#6b7a94" font-weight="700"> : </tspan><tspan fill="#e3262c" font-weight="700">443</tspan></text></g></svg>
