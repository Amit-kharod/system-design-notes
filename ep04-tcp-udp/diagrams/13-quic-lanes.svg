<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="439" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">One lost packet in the feed: TCP stalls every photo, QUIC only one</text><text x="30" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Over TCP: all photos share one ordered line</text><g class="box"><rect x="30" y="100" width="70" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="65.0" y="119.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">photo 1</text></g><g class="box"><rect x="112" y="100" width="70" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="147.0" y="119.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">photo 2</text></g><g class="box"><rect x="194" y="100" width="70" height="30" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="229.0" y="119.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">lost</text></g><g class="box"><rect x="276" y="100" width="70" height="30" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="311.0" y="119.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">photo 4</text></g><g class="box"><rect x="358" y="100" width="70" height="30" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="393.0" y="119.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">photo 5</text></g><g class="box"><rect x="440" y="100" width="70" height="30" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="475.0" y="119.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">photo 6</text></g><text x="30" y="160" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">Everything behind the lost packet waits for the resend, even photos that arrived fine.</text><text x="30" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Over QUIC (on UDP): every photo has its own stream</text><text x="30" y="252" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#243352" text-anchor="start" xml:space="preserve">photo 1</text><g class="box"><rect x="120" y="232" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="155.0" y="250.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><g class="box"><rect x="202" y="232" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="237.0" y="250.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><g class="box"><rect x="284" y="232" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="319.0" y="250.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><g class="box"><rect x="366" y="232" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="401.0" y="250.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><text x="30" y="292" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#243352" text-anchor="start" xml:space="preserve">photo 2</text><g class="box"><rect x="120" y="272" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="155.0" y="290.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><g class="box"><rect x="202" y="272" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="237.0" y="290.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><g class="box"><rect x="284" y="272" width="70" height="28" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="319.0" y="290.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">lost</text></g><g class="box"><rect x="366" y="272" width="70" height="28" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="401.0" y="290.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">waits</text></g><text x="30" y="332" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#243352" text-anchor="start" xml:space="preserve">photo 3</text><g class="box"><rect x="120" y="312" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="155.0" y="330.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><g class="box"><rect x="202" y="312" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="237.0" y="330.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><g class="box"><rect x="284" y="312" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="319.0" y="330.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><g class="box"><rect x="366" y="312" width="70" height="28" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="401.0" y="330.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ok</text></g><text x="30" y="372" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fa8" text-anchor="start" xml:space="preserve">Only photo 2 pauses until its packet is resent. QUIC does its own numbering, ACKs, resend and encryption on top of UDP.</text><text x="30" y="400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">Stacks:  HTTP/1.1, HTTP/2 · TCP · IP        and        HTTP/3 · QUIC · UDP · IP</text></svg>
