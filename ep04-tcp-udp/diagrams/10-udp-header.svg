<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="379" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">The UDP header: 8 bytes, four fields of 2 bytes each</text><text x="190" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">0</text><text x="510" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">16</text><text x="830" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7a94" text-anchor="end" xml:space="preserve">31</text><g class="box"><rect x="190" y="94" width="318" height="44" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="349.0" y="120.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Source port (2 B)</text></g><g class="box"><rect x="510" y="94" width="318" height="44" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="669.0" y="120.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Destination port (2 B)</text></g><text x="850" y="122" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">2 + 2 bytes</text><g class="box"><rect x="190" y="144" width="318" height="44" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="349.0" y="170.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Length (2 B)</text></g><g class="box"><rect x="510" y="144" width="318" height="44" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="669.0" y="170.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Checksum (2 B)</text></g><text x="850" y="172" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">2 + 2 bytes</text><text x="30" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Side by side (bar length = header size):</text><text x="30" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#243352" text-anchor="start" xml:space="preserve">UDP</text><rect x="90" y="246" width="128" height="22" rx="5" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="228" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#2f6fa8" text-anchor="start" xml:space="preserve">8 bytes</text><text x="30" y="296" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#243352" text-anchor="start" xml:space="preserve">TCP</text><rect x="90" y="280" width="320" height="22" rx="5" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="420" y="296" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="start" xml:space="preserve">20 bytes or more</text><text x="30" y="340" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Length counts the bytes in this datagram. The checksum is computed from the data: a changed bit makes the total not match.</text></svg>
