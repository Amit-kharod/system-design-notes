<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="960" height="290" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="289" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">The 65,536 port numbers (0 to 65,535): where the server's and the phone's ports come from</text><g class="box"><rect x="30" y="84" width="144" height="74" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="102.0" y="117.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Well-known ports</text><text x="102.0" y="137.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">0 to 1,023</text></g><text x="102.0" y="186" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">fixed services: 22, 53, 80, 443</text><g class="box"><rect x="180" y="84" width="404" height="74" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="382.0" y="117.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Registered ports</text><text x="382.0" y="137.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">1,024 to 49,151</text></g><text x="382.0" y="186" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">listed: 3306, 5432</text><g class="box"><rect x="590" y="84" width="334" height="74" rx="10" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="757.0" y="117.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Dynamic ports</text><text x="757.0" y="137.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">49,152 to 65,535</text></g><text x="757.0" y="186" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">IANA's range for free ports</text><text x="30" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="start" xml:space="preserve">Android picks the phone's free port from 32,768 to 60,999: the Instagram connection got 51000.</text><text x="30" y="258" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">When the connection closes, the port is free again. The bars are not to scale.</text></svg>
