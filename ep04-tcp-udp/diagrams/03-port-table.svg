width="90" height="36" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="545.0" y="106.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">25</text></g><g class="box"><rect x="596" y="84" width="334" height="36" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="763.0" y="106.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">SMTP: email servers talk to each other</text></g><g class="box"><rect x="30" y="132" width="90" height="36" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="75.0" y="154.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">443</text></g><g class="box"><rect x="126" y="132" width="334" height="36" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="293.0" y="154.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">HTTPS: encrypted HTTP; websites, app APIs</text></g><g class="box"><rect x="500" y="132" width="90" height="36" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="545.0" y="154.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">5432</text></g><g class="box"><rect x="596" y="132" width="334" height="36" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="763.0" y="154.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">PostgreSQL: a database</text></g><g class="box"><rect x="30" y="180" width="90" height="36" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="75.0" y="202.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">53</text></g><g class="box"><rect x="126" y="180" width="334" height="36" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="293.0" y="202.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">DNS: Domain Name System questions</text></g><g class="box"><rect x="500" y="180" width="90" height="36" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="545.0" y="202.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">3306</text></g><g class="box"><rect x="596" y="180" width="334" height="36" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="763.0" y="202.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">MySQL: a database</text></g><g class="box"><rect x="30" y="228" width="90" height="36" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="75.0" y="250.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">22</text></g><g class="box"><rect x="126" y="228" width="334" height="36" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="293.0" y="250.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">SSH: Secure Shell, login to a server</text></g><g class="box"><rect x="500" y="228" width="90" height="36" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="545.0" y="250.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">80 / 443</text></g><g class="box"><rect x="596" y="228" width="334" height="36" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="763.0" y="250.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">WebSocket, SSL / TLS: no ports of their own</text></g><text x="30" y="294" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">APIs (Application Programming Interfaces: the way between an app and its server) and WebSocket ride on 443 or 80.</text><text x="30" y="318" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Ports 0 to 1,023 are the well-known ports, kept for services like these.</text></svg>
