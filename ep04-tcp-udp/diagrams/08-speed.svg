<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="399" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Speed: how many segments TCP sends before it waits for ACKs (one bar = one round trip)</text><rect x="40" y="276.0" width="90" height="24.0" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="85" y="268.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">10</text><rect x="150" y="252.0" width="90" height="48.0" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="195" y="244.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">20</text><rect x="260" y="204.0" width="90" height="96.0" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="305" y="196.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">40</text><rect x="370" y="108.0" width="90" height="192.0" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="415" y="100.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">80</text><g class="box"><rect x="480" y="264" width="90" height="36" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="525.0" y="286.68" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#e3262c" text-anchor="middle" xml:space="preserve">loss</text></g><rect x="590" y="165.6" width="90" height="134.4" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="635" y="157.6" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">lower</text><rect x="700" y="151.20000000000002" width="90" height="148.79999999999998" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="745" y="143.20000000000002" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">a bit more</text><rect x="810" y="136.8" width="90" height="163.2" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="855" y="128.8" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">more</text><line x1="30" y1="300" x2="930" y2="300" stroke="#c9d6e6" stroke-width="1.4"/><text x="30" y="336" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="start" xml:space="preserve">Slow start: about 10 segments first, then double after every round trip that comes back clean.</text><text x="30" y="360" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="start" xml:space="preserve">A loss means a jam on the road: TCP cuts its speed, then grows again slowly. That is congestion control.</text><text x="30" y="384" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">This is why a big download starts slow. Flow control is separate: the server's window says how much room it has left.</text></svg>
