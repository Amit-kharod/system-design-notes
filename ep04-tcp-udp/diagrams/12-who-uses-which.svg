<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="419" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Who uses which</text><rect x="30" y="76" width="430" height="170" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="60" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">TCP: every byte must arrive</text><text x="60" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">•  websites, app APIs (443)</text><text x="60" y="164" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">•  UPI payments</text><text x="60" y="188" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">•  chat messages (Instagram DM)</text><text x="60" y="212" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">•  file downloads</text><rect x="500" y="76" width="430" height="170" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="530" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">UDP: on time beats complete</text><text x="530" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">•  video and voice calls</text><text x="530" y="164" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">•  online game positions</text><text x="530" y="188" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">•  DNS questions (port 53)</text><text x="530" y="212" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">•  QUIC (YouTube, Instagram)</text><text x="30" y="282" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">DNS uses both, on the same port 53:</text><g class="box"><rect x="30" y="298" width="190" height="34" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="125.0" y="319.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">question over UDP 53</text></g><line x1="224" y1="315" x2="306" y2="315" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="310" y="298" width="220" height="34" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="420.0" y="319.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">answer too big: TC = 1</text></g><line x1="534" y1="315" x2="616" y2="315" stroke="#e3262c" stroke-width="2" marker-end="url(#ae3262c)"/><g class="box"><rect x="620" y="298" width="230" height="34" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="735.0" y="319.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">ask again over TCP 53</text></g><text x="30" y="372" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Rule of thumb: where every byte must arrive, TCP. Where being on time matters more than being complete, UDP.</text></svg>
