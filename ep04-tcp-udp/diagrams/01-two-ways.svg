<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="359" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Two ways to send data: TCP for the Instagram DM, UDP for the Instagram call</text><text x="30" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">TCP  (Transmission Control Protocol): the DM "Kal 5 baje CP pe milte hain :)"</text><g class="box"><rect x="30" y="100" width="140" height="56" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="100.0" y="124.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Phone</text><text x="100.0" y="144.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Instagram app</text></g><g class="box"><rect x="790" y="100" width="140" height="56" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="860.0" y="124.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Server</text><text x="860.0" y="144.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">i.instagram.com</text></g><g class="box"><rect x="230" y="114" width="140" height="28" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="300.0" y="132.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">Kal 5 baje</text></g><g class="box"><rect x="400" y="114" width="140" height="28" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="470.0" y="132.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">CP pe mil</text></g><g class="box"><rect x="570" y="114" width="140" height="28" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="640.0" y="132.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">te hain :)</text></g><line x1="172" y1="128" x2="226" y2="128" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="744" y1="128" x2="786" y2="128" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480" y="176" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">whole, in order; anything lost is sent again</text><text x="30" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">UDP  (User Datagram Protocol): the Instagram video call</text><g class="box"><rect x="30" y="248" width="140" height="56" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="100.0" y="272.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Phone</text><text x="100.0" y="292.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Instagram app</text></g><g class="box"><rect x="790" y="248" width="140" height="56" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="860.0" y="272.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Server</text><text x="860.0" y="292.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">call server</text></g><g class="box"><rect x="230" y="262" width="100" height="28" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="280.0" y="280.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">voice 1</text></g><g class="box"><rect x="360" y="262" width="100" height="28" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="410.0" y="280.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">voice 2</text></g><g class="box"><rect x="490" y="262" width="100" height="28" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="540.0" y="280.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">lost</text></g><g class="box"><rect x="620" y="262" width="100" height="28" rx="6" fill="#ffffff" stroke="#2f6fa8" stroke-width="1.4"/><text x="670.0" y="280.32" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">voice 4</text></g><line x1="172" y1="276" x2="226" y2="276" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="724" y1="276" x2="786" y2="276" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480" y="324" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e3262c" text-anchor="middle" xml:space="preserve">sent once, no waiting; a lost one stays lost and the call goes on</text></svg>
