<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="469" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">The TCP header: at least 20 bytes in front of the data (one row = 32 bits = 4 bytes)</text><text x="190" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">0</text><text x="510" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">16</text><text x="830" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7a94" text-anchor="end" xml:space="preserve">31</text><g class="box"><rect x="190" y="94" width="318" height="44" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="349.0" y="120.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Source port (2 B)</text></g><g class="box"><rect x="510" y="94" width="318" height="44" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="669.0" y="120.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Destination port (2 B)</text></g><text x="850" y="122" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">2 + 2 bytes</text><g class="box"><rect x="190" y="144" width="638" height="44" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="509.0" y="170.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Sequence number (4 B)</text></g><text x="850" y="172" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">4 bytes</text><g class="box"><rect x="190" y="194" width="638" height="44" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="509.0" y="220.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Acknowledgment number (4 B)</text></g><text x="850" y="222" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">4 bytes</text><g class="box"><rect x="190" y="244" width="318" height="44" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="349.0" y="270.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Offset, flags (SYN, ACK, FIN...)</text></g><g class="box"><rect x="510" y="244" width="318" height="44" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="669.0" y="270.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Window</text></g><text x="850" y="272" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">4 bytes</text><g class="box"><rect x="190" y="294" width="318" height="44" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="349.0" y="320.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Checksum</text></g><g class="box"><rect x="510" y="294" width="318" height="44" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="669.0" y="320.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Urgent pointer</text></g><text x="850" y="322" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">4 bytes</text><rect x="190" y="344" width="638" height="36" rx="8" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4" stroke-dasharray="5 4"/><text x="509" y="367" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">Options (optional, up to 40 more bytes)</text><text x="30" y="412" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#e3262c" text-anchor="start" xml:space="preserve">2 + 2 + 4 + 4 + 4 + 4 = 20 bytes</text><text x="30" y="438" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The ports are the same two as in UDP. Everything after them is what TCP adds for order and resend.</text></svg>
