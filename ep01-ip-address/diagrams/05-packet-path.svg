<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="431" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">The path of one packet, and what each routing table holds</text><rect x="16" y="54" width="314" height="106" rx="10" fill="#eef4fa" stroke="none" stroke-width="1.4"/><text x="26" y="72" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">home network</text><rect x="336" y="54" width="420" height="106" rx="10" fill="#eef4fa" stroke="none" stroke-width="1.4"/><text x="346" y="72" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">ISP's network</text><rect x="762" y="54" width="182" height="106" rx="10" fill="#eef4fa" stroke="none" stroke-width="1.4"/><text x="772" y="72" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">chat server's network</text><g class="box"><rect x="26" y="84" width="130" height="62" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="91.0" y="111.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Your phone</text><text x="91.0" y="131.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">192.168.1.5</text></g><line x1="158" y1="115" x2="266" y2="115" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="268" y="84" width="130" height="62" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="333.0" y="111.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Home router</text><text x="333.0" y="131.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">the WiFi box</text></g><line x1="400" y1="115" x2="442" y2="115" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="444" y="84" width="120" height="62" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="504.0" y="111.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">ISP router A</text><text x="504.0" y="131.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Jio / Airtel</text></g><line x1="566" y1="115" x2="608" y2="115" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="610" y="84" width="120" height="62" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="670.0" y="111.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Router B</text><text x="670.0" y="131.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">the next hop</text></g><line x1="732" y1="115" x2="784" y2="115" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="786" y="84" width="150" height="62" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="861.0" y="111.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Chat server</text><text x="861.0" y="131.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">198.51.100.20</text></g><g class="box"><rect x="540" y="166" width="396" height="28" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="550" y="185" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" text-anchor="start" xml:space="preserve"><tspan fill="#243352" font-weight="600">packet:  SENDER 192.168.1.5  </tspan><tspan fill="#e3262c" font-weight="800">RECEIVER 198.51.100.20</tspan></text></g><g class="box"><rect x="26" y="214" width="440" height="98" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="40" y="236" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Home router: 2 lines</text><text x="40" y="256" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">network</text><text x="254.8" y="256" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">next hop</text><text x="40" y="278" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">192.168.1.x (home)</text><text x="254.8" y="278" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">deliver directly</text><rect x="32" y="288" width="428" height="22" rx="5" fill="#e6f4fc" stroke="none" stroke-width="1.4"/><text x="40" y="304" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">everything else</text><text x="254.8" y="304" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">ISP router (default route)</text></g><g class="box"><rect x="496" y="214" width="440" height="98" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="510" y="236" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">ISP router A: two of its lines</text><text x="510" y="256" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">network</text><text x="724.8" y="256" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">next hop</text><rect x="502" y="262" width="428" height="22" rx="5" fill="#e6f4fc" stroke="none" stroke-width="1.4"/><text x="510" y="278" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">198.51.100.x</text><text x="724.8" y="278" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">router B</text><text x="510" y="304" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">192.0.2.x</text><text x="724.8" y="304" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">router C</text></g><line x1="333" y1="148" x2="333" y2="212" stroke="#6b7a94" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="504" y1="148" x2="520" y2="212" stroke="#6b7a94" stroke-width="1.2" stroke-dasharray="4 4"/><text x="26" y="340" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">No router knows the whole path. Each one reads the receiver's address, finds that network in its table,</text><text x="26" y="360" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">and hands the packet to the next hop. Router B then does the same lookup with its own table.</text><text x="26" y="394" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The big routers of the internet carry about 11 lakh IPv4 lines (10,91,990 on 12 Nov 2026), not 430 crore:</text><text x="26" y="413" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">one line covers a whole block of addresses.</text></svg>
