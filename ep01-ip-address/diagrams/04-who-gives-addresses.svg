<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 452" width="960" height="452" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="451" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Who hands out IP addresses: from the top down, always in blocks</text><g class="box"><rect x="370" y="60" width="220" height="76" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="480.0" y="85.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">IANA</text><text x="480.0" y="105.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Internet Assigned Numbers</text><text x="480.0" y="123.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Authority: the global pool</text></g><text x="612" y="94" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">gives large blocks to the</text><text x="612" y="111" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">five regional registries</text><g class="box"><rect x="40" y="176" width="168" height="64" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="124.0" y="204.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">AFRINIC</text><text x="124.0" y="224.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Africa</text></g><line x1="480" y1="136" x2="124" y2="174" stroke="#6b7a94" stroke-width="1.3" marker-end="url(#a6b7a94)"/><g class="box"><rect x="218" y="176" width="168" height="64" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="302.0" y="195.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">APNIC</text><text x="302.0" y="215.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Asia-Pacific,</text><text x="302.0" y="233.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">India included</text></g><line x1="480" y1="136" x2="302" y2="174" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="396" y="176" width="168" height="64" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="480.0" y="204.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">ARIN</text><text x="480.0" y="224.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">North America</text></g><line x1="480" y1="136" x2="480" y2="174" stroke="#6b7a94" stroke-width="1.3" marker-end="url(#a6b7a94)"/><g class="box"><rect x="574" y="176" width="168" height="64" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="658.0" y="195.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">LACNIC</text><text x="658.0" y="215.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Latin America and</text><text x="658.0" y="233.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">the Caribbean</text></g><line x1="480" y1="136" x2="658" y2="174" stroke="#6b7a94" stroke-width="1.3" marker-end="url(#a6b7a94)"/><g class="box"><rect x="752" y="176" width="168" height="64" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="836.0" y="195.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">RIPE NCC</text><text x="836.0" y="215.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Europe, Middle East,</text><text x="836.0" y="233.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">parts of Central Asia</text></g><line x1="480" y1="136" x2="836" y2="174" stroke="#6b7a94" stroke-width="1.3" marker-end="url(#a6b7a94)"/><g class="box"><rect x="218" y="292" width="168" height="62" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="302.0" y="319.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">ISP</text><text x="302.0" y="339.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Jio, Airtel, ...</text></g><line x1="302" y1="240" x2="302" y2="290" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="30" y="292" width="160" height="62" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="110.0" y="319.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">IRINN</text><text x="110.0" y="339.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">India's national registry</text></g><line x1="250" y1="240" x2="140" y2="290" stroke="#6b7a94" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a6b7a94)"/><line x1="190" y1="323" x2="216" y2="323" stroke="#6b7a94" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#a6b7a94)"/><text x="160" y="266" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6b7a94" text-anchor="end" xml:space="preserve">or through</text><g class="box"><rect x="218" y="384" width="168" height="56" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="302.0" y="408.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Your connection</text><text x="302.0" y="428.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#e3262c" text-anchor="middle" xml:space="preserve">one address</text></g><line x1="302" y1="354" x2="302" y2="382" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="436" y="300" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">At every step the blocks get smaller:</text><text x="436" y="326" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">•  IANA → registries: huge blocks</text><text x="436" y="348" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">•  registry → ISP: large blocks</text><text x="436" y="370" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">•  ISP → your connection: one address</text><text x="436" y="392" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">A block = addresses that start with the same bits.</text><text x="436" y="426" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">At home that one address goes to your WiFi router (Ep 2).</text></svg>
