<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" width="960" height="352" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="351" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Finding an IP's location: one number, sorted ranges, binary search</text><text x="40" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" xml:space="preserve"><tspan fill="#1a2640" font-weight="800">1.  The IP becomes one number:   </tspan><tspan fill="#243352" font-weight="700">192.0.2.70</tspan><tspan fill="#6b7a94" font-weight="600">  →  </tspan><tspan fill="#e3262c" font-weight="800">3,22,12,26,054</tspan></text><text x="40" y="124" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">2.  The ranges, sorted by their first address (each start is also one number):</text><g class="box"><rect x="40" y="138" width="206" height="64" rx="8" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="143" y="160" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">192.0.2.0 – .63</text><text x="143" y="181" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Pune</text><text x="143" y="197" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">starts at 3,22,12,25,984</text></g><g class="box"><rect x="262" y="138" width="206" height="64" rx="8" fill="#e6f4fc" stroke="#e3262c" stroke-width="2"/><text x="365" y="160" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">192.0.2.64 – .127</text><text x="365" y="181" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#e3262c" text-anchor="middle" xml:space="preserve">Delhi</text><text x="365" y="197" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">starts at 3,22,12,26,048</text></g><g class="box"><rect x="484" y="138" width="206" height="64" rx="8" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="587" y="160" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">192.0.2.128 – .191</text><text x="587" y="181" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Chennai</text><text x="587" y="197" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">starts at 3,22,12,26,112</text></g><g class="box"><rect x="706" y="138" width="206" height="64" rx="8" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="809" y="160" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">192.0.2.192 – .255</text><text x="809" y="181" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Kolkata</text><text x="809" y="197" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">starts at 3,22,12,26,176</text></g><text x="40" y="240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">3.  Binary search: look at the middle, keep the half that can hold the IP.</text><text x="40" y="266" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">step 1: the middle range (Chennai) starts at .128, and 70 &lt; 128, so keep the left half.</text><text x="40" y="288" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="start" xml:space="preserve"><tspan fill="#243352" font-weight="500">step 2: Delhi starts at .64: 70 ≥ 64, and 70 is not past .127, so the answer is </tspan><tspan fill="#e3262c" font-weight="800">Delhi</tspan><tspan fill="#243352" font-weight="500">.</tspan></text><text x="40" y="326" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">4 ranges: 2 steps.  10 lakh ranges: about 20 steps, because each step halves what is left.</text></svg>
