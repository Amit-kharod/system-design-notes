fill="#243352" text-anchor="start" xml:space="preserve">So all 8 appear twice:</text><text x="690" y="169" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#243352" font-weight="500">8 with a 0</tspan><tspan fill="#6b7a94" font-weight="500"> + </tspan><tspan fill="#243352" font-weight="500">8 with a 1</tspan><tspan fill="#243352" font-weight="500"> = 16.</tspan></text><text x="690" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">n bits  →  2ⁿ combinations</text><text x="690" y="242" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">2, 4, 8, 16, 32, 64, 128, 256</text><text x="690" y="268" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">8 bits  →  2⁸ = 256</text><text x="690" y="292" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">32 bits →  2³² ≈ 430 crore</text></svg>
