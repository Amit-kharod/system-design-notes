<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 344" width="960" height="344" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="343" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">IPv6: the same idea, with 128 bits</text><text x="30" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1a2640" text-anchor="start" xml:space="preserve">IPv4</text><rect x="110" y="70" width="190" height="26" rx="6" fill="#2f6fa8" stroke="none" stroke-width="1.4"/><text x="316" y="88" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">32 bits  →  2³² ≈ 4.3 × 10⁹ addresses (430 crore)</text><text x="30" y="136" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#1a2640" text-anchor="start" xml:space="preserve">IPv6</text><rect x="110" y="118" width="760" height="26" rx="6" fill="#1a2640" stroke="none" stroke-width="1.4"/><text x="110" y="170" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#243352" font-weight="600">128 bits  →  2¹²⁸ ≈ 3.4 × 10³⁸ addresses:  </tspan><tspan fill="#e3262c" font-weight="800">2⁹⁶ times more, not 4 times</tspan></text><g class="box"><rect x="110" y="192" width="86" height="34" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="153.0" y="213.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">2001</text></g><g class="box"><rect x="206" y="192" width="86" height="34" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="249.0" y="213.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">0db8</text></g><g class="box"><rect x="302" y="192" width="86" height="34" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="345.0" y="213.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">85a3</text></g><g class="box"><rect x="398" y="192" width="86" height="34" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="441.0" y="213.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">0000</text></g><g class="box"><rect x="494" y="192" width="86" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="537.0" y="213.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">0000</text></g><g class="box"><rect x="590" y="192" width="86" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="633.0" y="213.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">8a2e</text></g><g class="box"><rect x="686" y="192" width="86" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="729.0" y="213.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">0370</text></g><g class="box"><rect x="782" y="192" width="86" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="825.0" y="213.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">7334</text></g><text x="30" y="214" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">written</text><path d="M110 234 v9 h366 v-9" fill="none" stroke="#2f6fa8" stroke-width="2"/><path d="M494 234 v9 h366 v-9" fill="none" stroke="#1a2640" stroke-width="2"/><text x="293" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">first 64 bits: the network</text><text x="677" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">last 64 bits: the device</text><text x="30" y="298" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Each group is 4 hexadecimal digits (0-9, a-f) = 16 bits.   Short form: 2001:db8:85a3::8a2e:370:7334</text><text x="30" y="320" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Leading zeros in a group are dropped, and one run of all-zero groups is written ::</text></svg>
