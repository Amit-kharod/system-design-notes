"424" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">A reply to port 51000 goes to phone 1, a reply to 49200 to phone 2. An entry is made only when a packet goes out.</text></svg>
