<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="355" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Same network or not? Two ANDs and a compare</text><text x="30" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Your phone</text><text x="124" y="86" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13.5" text-anchor="start" xml:space="preserve"><tspan fill="#243352" font-weight="700">192.168.1.5</tspan><tspan fill="#6b7a94" font-weight="600">  AND 255.255.255.0  =  </tspan><tspan fill="#2f6fa8" font-weight="800">192.168.1.0</tspan><tspan fill="#6b7a94" font-weight="600">  (its own network)</tspan></text><g class="box"><rect x="30" y="114" width="200" height="62" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="130.0" y="141.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">The TV</text><text x="130.0" y="161.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">192.168.1.12</text></g><line x1="234" y1="145" x2="286" y2="145" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="260.0" y="138.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">AND</text><g class="box"><rect x="290" y="127" width="180" height="36" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="380.0" y="149.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">192.168.1.0</text></g><line x1="474" y1="145" x2="526" y2="145" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="500.0" y="138.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">compare</text><g class="box"><rect x="530" y="114" width="180" height="62" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="620" y="141" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#243352" text-anchor="middle" xml:space="preserve">= 192.168.1.0</text><text x="620" y="161" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">same network</text></g><line x1="714" y1="145" x2="746" y2="145" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="750" y="114" width="180" height="62" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="840.0" y="141.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">send directly</text><text x="840.0" y="161.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">to the TV</text></g><g class="box"><rect x="30" y="206" width="200" height="62" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="130.0" y="233.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Chat server</text><text x="130.0" y="253.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">198.51.100.20</text></g><line x1="234" y1="237" x2="286" y2="237" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="260.0" y="230.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">AND</text><g class="box"><rect x="290" y="219" width="180" height="36" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="380.0" y="241.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">198.51.100.0</text></g><line x1="474" y1="237" x2="526" y2="237" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="500.0" y="230.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">compare</text><g class="box"><rect x="530" y="206" width="180" height="62" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="620" y="233" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#243352" text-anchor="middle" xml:space="preserve">≠ 192.168.1.0</text><text x="620" y="253" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e3262c" text-anchor="middle" xml:space="preserve">not at home</text></g><line x1="714" y1="237" x2="746" y2="237" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="750" y="206" width="180" height="62" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="840.0" y="233.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#e3262c" text-anchor="middle" xml:space="preserve">send to the gateway</text><text x="840.0" y="253.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">router 192.168.1.1</text></g><text x="30" y="314" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The gateway is the home router's inside address: the door out of the home network.</text><text x="30" y="334" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The phone learns the gateway's address from DHCP, together with its own address and the mask.</text></svg>
