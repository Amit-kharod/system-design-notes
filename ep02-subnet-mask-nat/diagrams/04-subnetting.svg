ace="preserve">.224 – .255</text></g><text x="30" y="318" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="start" xml:space="preserve"><tspan fill="#1a2640" font-weight="800">192.168.233.145/27:  </tspan><tspan fill="#243352" font-weight="500">145 is in the block .128 – .159, so the network is </tspan><tspan fill="#e3262c" font-weight="800">.128</tspan><tspan fill="#243352" font-weight="500"> and the broadcast is </tspan><tspan fill="#e3262c" font-weight="800">.159</tspan></text><text x="30" y="340" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Addresses in a block = 2 to the power (32 − prefix).  For devices: that number − 2.</text></svg>
