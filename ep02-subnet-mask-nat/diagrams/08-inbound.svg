<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="391" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Conversations start from inside: the NAT table lets in only replies</text><line x1="334" y1="62" x2="334" y2="372" stroke="#c9d6e6" stroke-width="1.2"/><text x="30" y="82" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Someone outside knocks</text><g class="box"><rect x="40" y="98" width="260" height="56" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="170.0" y="122.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">A computer outside</text><text x="170.0" y="142.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">anywhere on the internet</text></g><line x1="150" y1="156" x2="150" y2="210" stroke="#6b7a94" stroke-width="2" marker-end="url(#a6b7a94)"/><text x="160" y="188" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">TO 203.0.113.7 : 6000</text><g class="box"><rect x="40" y="212" width="260" height="56" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="170.0" y="236.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Your router</text><text x="170.0" y="256.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">203.0.113.7</text></g><text x="170" y="294" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="middle" xml:space="preserve">No entry for port 6000 in its table:</text><text x="170" y="313" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="middle" xml:space="preserve">the packet is not forwarded.</text><g class="box"><rect x="40" y="328" width="260" height="40" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4" stroke-dasharray="5 4"/><text x="170.0" y="352.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#6b7a94" text-anchor="middle" xml:space="preserve">Your phone  192.168.1.5</text></g><text x="354" y="82" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">How your friend still gets your message</text><g class="box"><rect x="364" y="124" width="150" height="58" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="439.0" y="149.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">You</text><text x="439.0" y="169.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">your home</text></g><g class="box"><rect x="586" y="124" width="160" height="58" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="666.0" y="149.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Chat server</text><text x="666.0" y="169.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">198.51.100.20</text></g><g class="box"><rect x="806" y="124" width="134" height="58" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="873.0" y="149.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Friend's phone</text><text x="873.0" y="169.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">behind its router</text></g><path d="M873 184 V222 H666 V186" fill="none" stroke="#6b7a94" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a6b7a94)"/><text x="770" y="242" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6b7a94" text-anchor="middle" xml:space="preserve">1. opened earlier, from inside, and kept open</text><line x1="516" y1="152" x2="584" y2="152" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="550" y="114" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">2. your message</text><line x1="748" y1="152" x2="804" y2="152" stroke="#e3262c" stroke-width="2" marker-end="url(#ae3262c)"/><text x="776" y="106" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e3262c" text-anchor="middle" xml:space="preserve">3. down the open connection</text><text x="354" y="284" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">4. The message reaches the friend's router like a reply. The router finds the entry for</text><text x="354" y="304" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">that connection in its NAT table and forwards it to the right phone.</text><text x="354" y="336" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Chat apps keep a connection like this open all the time.</text></svg>
