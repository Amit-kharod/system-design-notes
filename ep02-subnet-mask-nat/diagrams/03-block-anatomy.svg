2.5" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">.12</text></g><text x="639" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">TV</text><g class="box"><rect x="666" y="96" width="144" height="40" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4" stroke-dasharray="5 4"/><text x="738" y="120.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">.13 to .253</text></g><g class="box"><rect x="812" y="96" width="46" height="40" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="835.0" y="120.32" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">.254</text></g><g class="box"><rect x="860" y="96" width="46" height="40" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="883.0" y="120.32" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">.255</text></g><text x="40" y="162" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="start" xml:space="preserve">network address</text><text x="40" y="180" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">device bits 00000000</text><text x="906" y="162" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="end" xml:space="preserve">broadcast address</text><text x="906" y="180" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#6b7a94" text-anchor="end" xml:space="preserve">device bits 11111111</text><text x="440" y="162" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">white = free: the router lends these to devices that join</text><text x="40" y="220" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">8 device bits → 2⁸ = 256 addresses. The first and the last are kept back: 256 − 2 = 254 for devices.</text><text x="40" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">With n device bits: 2ⁿ addresses, 2ⁿ − 2 for devices.</text></svg>
