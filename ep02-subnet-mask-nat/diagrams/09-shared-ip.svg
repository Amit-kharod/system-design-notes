<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="315" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">A building of 100 homes: how many public addresses does it need?</text><text x="30" y="84" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">100 homes × 10 devices each (phones, laptops, a TV) = 1,000 devices</text><text x="30" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Without NAT</text><rect x="230" y="112" width="640" height="30" rx="6" fill="#2f6fa8" stroke="none" stroke-width="1.4"/><text x="856" y="132" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="end" xml:space="preserve">1,000 public addresses: one per device</text><text x="30" y="182" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">With NAT</text><rect x="230" y="162" width="64" height="30" rx="6" fill="#e3262c" stroke="none" stroke-width="1.4"/><text x="306" y="182" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="start" xml:space="preserve">100: one per home, for its router</text><text x="30" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">With carrier-grade NAT</text><rect x="230" y="212" width="14" height="30" rx="4" fill="#ffffff" stroke="#6b7a94" stroke-width="1.4" stroke-dasharray="5 4"/><text x="256" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">fewer still: many homes share one public address</text><text x="30" y="286" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">So one public IP can be a whole home, office, college or neighbourhood. It is not one person.</text></svg>
