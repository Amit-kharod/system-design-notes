<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 304" width="960" height="304" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="303" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Carrier-grade NAT: a second, much bigger NAT inside the ISP</text><text x="30" y="80" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2f6fa8" text-anchor="start" xml:space="preserve">private  192.168.0.0/16</text><text x="250" y="80" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2f6fa8" text-anchor="start" xml:space="preserve">shared  100.64.0.0/10</text><text x="490" y="80" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">public address, shared</text><g class="box"><rect x="30" y="96" width="150" height="70" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="105.0" y="127.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Your phone</text><text x="105.0" y="147.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">192.168.1.5</text></g><g class="box"><rect x="250" y="96" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="335.0" y="127.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Home router</text><text x="335.0" y="147.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">outside: 100.64.x.x</text></g><g class="box"><rect x="490" y="96" width="190" height="70" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="585.0" y="127.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">ISP's NAT (CGNAT)</text><text x="585.0" y="147.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">public 203.0.113.7</text></g><g class="box"><rect x="760" y="96" width="170" height="70" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="845.0" y="127.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Any server</text><text x="845.0" y="147.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">sees 203.0.113.7</text></g><line x1="182" y1="131" x2="248" y2="131" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="422" y1="131" x2="488" y2="131" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="682" y1="131" x2="748" y2="131" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="490" y="192" width="190" height="44" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="585.0" y="218.68" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#6b7a94" text-anchor="middle" xml:space="preserve">many other customers</text></g><line x1="585" y1="190" x2="585" y2="170" stroke="#6b7a94" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a6b7a94)"/><text x="30" y="270" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">To the server, many unrelated people look like one address. So one IP address is not one person:</text><text x="30" y="288" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">blocking or rate-limiting one IP can hit a whole neighbourhood.</text></svg>
