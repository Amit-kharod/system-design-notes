<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="411" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">DHCP: how the phone gets its address, in four messages</text><g class="box"><rect x="70" y="56" width="200" height="54" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="170.0" y="79.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Your phone</text><text x="170.0" y="99.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">no address yet</text></g><g class="box"><rect x="690" y="56" width="200" height="54" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="790.0" y="79.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Home router</text><text x="790.0" y="99.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">the DHCP server</text></g><line x1="170" y1="112" x2="170" y2="352" stroke="#c9d6e6" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="790" y1="112" x2="790" y2="352" stroke="#c9d6e6" stroke-width="1.6" stroke-dasharray="4 4"/><text x="480" y="140" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan fill="#1a2640" font-weight="800">1  Discover    </tspan><tspan fill="#243352" font-weight="500">“Is anyone giving out addresses?”</tspan></text><line x1="174" y1="150" x2="784" y2="150" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480" y="168" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#6b7a94" text-anchor="middle" xml:space="preserve">sent to everyone (255.255.255.255): the phone knows no address yet</text><text x="480" y="198" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan fill="#1a2640" font-weight="800">2  Offer    </tspan><tspan fill="#243352" font-weight="500">“You can have 192.168.1.5.”</tspan></text><line x1="786" y1="208" x2="176" y2="208" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480" y="226" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#6b7a94" text-anchor="middle" xml:space="preserve">with the mask 255.255.255.0, the gateway 192.168.1.1, a DNS server and a lease time</text><text x="480" y="256" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan fill="#1a2640" font-weight="800">3  Request    </tspan><tspan fill="#243352" font-weight="500">“I will take 192.168.1.5.”</tspan></text><line x1="174" y1="266" x2="784" y2="266" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480" y="284" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#6b7a94" text-anchor="middle" xml:space="preserve">also sent to everyone, so any other DHCP server knows its offer was not taken</text><text x="480" y="314" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" xml:space="preserve"><tspan fill="#1a2640" font-weight="800">4  Acknowledge    </tspan><tspan fill="#243352" font-weight="500">“It is yours until the lease ends.”</tspan></text><line x1="786" y1="324" x2="176" y2="324" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="480" y="342" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#6b7a94" text-anchor="middle" xml:space="preserve">from now on the phone uses 192.168.1.5</text><text x="480" y="388" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" text-anchor="middle" xml:space="preserve"><tspan fill="#1a2640" font-weight="800">Result:  </tspan><tspan fill="#e3262c" font-weight="800">192.168.1.5 · mask 255.255.255.0 · gateway 192.168.1.1</tspan><tspan fill="#6b7a94" font-weight="600">, on lease</tspan></text></svg>
