<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="371" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Moving to a new server: lower the TTL a day before, raise it after</text><line x1="50" y1="168" x2="910" y2="168" stroke="#6b7a94" stroke-width="2"/><circle cx="110" cy="168" r="8" fill="#2f6fa8"/><rect x="10" y="80" width="200" height="62" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="110" y="104" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">today</text><text x="110" y="122" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">TTL 86,400 s</text><text x="110" y="138" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">(1 day)</text><circle cx="330" cy="168" r="8" fill="#2f6fa8"/><rect x="230" y="80" width="200" height="62" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="330" y="104" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">1 day or more before</text><text x="330" y="122" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">lower TTL to 300 s</text><text x="330" y="138" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">(5 minutes)</text><circle cx="570" cy="168" r="8" fill="#e3262c"/><rect x="470" y="80" width="200" height="62" rx="10" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="570" y="104" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">switch day</text><text x="570" y="122" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">record: new address</text><text x="570" y="138" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">203.0.113.30</text><circle cx="810" cy="168" r="8" fill="#2f6fa8"/><rect x="710" y="80" width="200" height="62" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="810" y="104" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">a few days later</text><text x="810" y="122" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">raise TTL back</text><text x="810" y="138" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">86,400 s</text><rect x="60" y="214" width="440" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="280" y="236" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">every cache, once the old TTL runs out, now holds a 5-minute copy</text><rect x="520" y="214" width="380" height="34" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="710" y="236" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">after the switch, everyone has the new address in 5 minutes</text><text x="30" y="292" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Why a day before: a cache that stored the record just before you lowered it still holds it for up to 86,400 s.</text><text x="30" y="314" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The cost of a short TTL is more questions to your name servers, so raise it again once the move is done.</text><text x="30" y="342" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">This is the practice RFC 1034 describes: reduce the TTL before an anticipated change, restore it afterwards.</text></svg>
