<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="419" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Buying codeman.com: three different jobs (suppose I bought it)</text><g class="box"><rect x="30" y="84" width="240" height="112" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="150.0" y="118.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Registrar: GoDaddy</text><text x="150.0" y="138.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">where you buy the name</text><text x="150.0" y="156.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">keeps: the domain is yours,</text><text x="150.0" y="174.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">until when, where to send the bill</text></g><g class="box"><rect x="360" y="84" width="240" height="112" rx="10" fill="#ffffff" stroke="#e3262c" stroke-width="1.4"/><text x="480.0" y="118.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Registry: Verisign</text><text x="480.0" y="138.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">keeps the whole .com list</text><text x="480.0" y="156.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">codeman.com is one entry:</text><text x="480.0" y="174.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">its name servers, no IP address</text></g><g class="box"><rect x="690" y="84" width="240" height="112" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="810.0" y="118.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Name servers: GoDaddy</text><text x="810.0" y="138.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">ns51.domaincontrol.com</text><text x="810.0" y="156.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">ns52.domaincontrol.com</text><text x="810.0" y="174.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">your own list: A, MX, TXT ...</text></g><line x1="272" y1="140" x2="358" y2="140" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="602" y1="140" x2="688" y2="140" stroke="#2f6fa8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a2f6fa8)"/><text x="315" y="126" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">2</text><text x="645" y="126" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">3</text><text x="30" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">1  You pay GoDaddy for one year of codeman.com.</text><text x="30" y="254" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">2  GoDaddy asks Verisign if the name is free, and files it there.</text><text x="30" y="276" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">3  GoDaddy tells Verisign: the list of codeman.com is on ns51 and ns52.domaincontrol.com.</text><g class="box"><rect x="30" y="300" width="900" height="40" rx="8" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="480" y="325" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">Of the price, about USD 11 goes to Verisign and 20 cents to ICANN. The rest is GoDaddy's.</text></g><text x="30" y="372" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#e3262c" text-anchor="start" xml:space="preserve">Registrar = where you buy. Registry = the TLD's list. Name server = your own list.</text><text x="30" y="396" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Moving your list to another name server (for example Cloudflare) changes step 3 only: you stay a customer of GoDaddy.</text></svg>
