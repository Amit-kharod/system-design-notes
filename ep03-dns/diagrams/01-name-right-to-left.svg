<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="329" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">A name is read from the right: root, top-level domain, domain, subdomain</text><g class="box"><rect x="60" y="82" width="150" height="48" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="135.0" y="113.2" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">blog</text></g><g class="box"><rect x="218" y="82" width="36" height="48" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="236.0" y="113.2" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">.</text></g><g class="box"><rect x="258" y="82" width="210" height="48" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="363.0" y="113.2" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">codeman</text></g><g class="box"><rect x="478" y="82" width="36" height="48" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="496.0" y="113.2" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">.</text></g><g class="box"><rect x="518" y="82" width="140" height="48" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="588.0" y="113.2" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#1a2640" text-anchor="middle" xml:space="preserve">com</text></g><g class="box"><rect x="668" y="82" width="60" height="48" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="698.0" y="113.2" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="20" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">.</text></g><text x="135" y="154" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">subdomain</text><text x="363" y="154" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">domain (the name you buy)</text><text x="588" y="154" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">TLD</text><text x="698" y="154" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="middle" xml:space="preserve">root</text><line x1="850" y1="106" x2="760" y2="106" stroke="#e3262c" stroke-width="2" marker-end="url(#ae3262c)"/><text x="852" y="88" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">read this way</text><text x="852" y="126" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">right to left</text><text x="30" y="196" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Every level is a domain:</text><g class="box"><rect x="30" y="210" width="130" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="95.0" y="229.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">com</text></g><g class="box"><rect x="168" y="210" width="190" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="263.0" y="229.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">codeman.com</text></g><g class="box"><rect x="366" y="210" width="230" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="481.0" y="229.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">blog.codeman.com</text></g><text x="30" y="272" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The full name really ends with a dot: blog.codeman.com. That last dot is the root, the top of the tree.</text><text x="30" y="294" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">youtube.com works the same way: youtube (domain), com (TLD), and the hidden root dot.</text><text x="30" y="316" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">In these notes codeman.com is only a "suppose I bought it" example: the real codeman.com belongs to someone else.</text></svg>
