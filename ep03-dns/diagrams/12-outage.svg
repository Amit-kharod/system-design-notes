<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 352" width="960" height="352" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="351" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">October 2021: the servers ran, but nobody could find their names</text><g class="box"><rect x="30" y="82" width="190" height="60" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="125.0" y="108.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Your phone</text><text x="125.0" y="128.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">3 apps, all failing</text></g><g class="box"><rect x="300" y="82" width="170" height="60" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="385.0" y="108.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Resolver</text><text x="385.0" y="128.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">asks for the name</text></g><g class="box"><rect x="550" y="82" width="190" height="60" rx="10" fill="#ffffff" stroke="#e3262c" stroke-width="1.4"/><text x="645.0" y="108.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Facebook's</text><text x="645.0" y="128.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">DNS servers: running</text></g><g class="box"><rect x="550" y="188" width="190" height="56" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="645.0" y="212.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Their app servers</text><text x="645.0" y="232.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">also running</text></g><line x1="222" y1="112" x2="298" y2="112" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="472" y1="112" x2="548" y2="112" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="740" y1="112" x2="790" y2="112" stroke="#e3262c" stroke-width="2.5"/><text x="850" y="104" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#e3262c" text-anchor="middle" xml:space="preserve">cut off from</text><text x="850" y="122" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#e3262c" text-anchor="middle" xml:space="preserve">the internet</text><text x="30" y="270" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">No address comes back, so no packet is ever sent.</text><text x="30" y="288" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#243352" text-anchor="start" xml:space="preserve">A wrong network change cut the DNS servers off from the internet.</text><text x="760" y="216" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">servers fine, but nobody</text><text x="760" y="234" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">can find them by name</text><text x="30" y="328" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">4 October 2021 · about 6 hours · Facebook, Instagram and WhatsApp (Meta Engineering and Cloudflare reports)</text></svg>
