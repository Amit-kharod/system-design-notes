<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="419" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">One row from the .com list, column by column</text><g class="box"><rect x="30" y="58" width="900" height="84" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/></g><text x="46" y="92" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">codeman.com.</text><text x="46" y="124" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">codeman.com.</text><text x="222" y="92" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">172800</text><text x="222" y="124" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">172800</text><text x="330" y="92" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#1a2640" text-anchor="start" xml:space="preserve">IN</text><text x="330" y="124" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">IN</text><text x="404" y="92" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">NS</text><text x="404" y="124" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">NS</text><text x="480" y="92" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#e3262c" text-anchor="start" xml:space="preserve">ns51.domaincontrol.com.</text><text x="480" y="124" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">ns52.domaincontrol.com.</text><line x1="100" y1="134" x2="116" y2="196" stroke="#6b7a94" stroke-width="1.2"/><g class="box"><rect x="30" y="198" width="172" height="84" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="116.0" y="227.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">1  NAME</text><text x="116.0" y="247.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">the name this row</text><text x="116.0" y="265.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">is about</text></g><line x1="250" y1="134" x2="298" y2="196" stroke="#6b7a94" stroke-width="1.2"/><g class="box"><rect x="212" y="198" width="172" height="84" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="298.0" y="227.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">2  KEEP FOR (TTL)</text><text x="298.0" y="247.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">seconds to remember it:</text><text x="298.0" y="265.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">1,72,800 = 2 days</text></g><line x1="340" y1="134" x2="480" y2="196" stroke="#6b7a94" stroke-width="1.2"/><g class="box"><rect x="394" y="198" width="172" height="84" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="480.0" y="227.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">3  CLASS</text><text x="480.0" y="247.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">always IN: Internet</text><text x="480.0" y="265.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">(old, never changes)</text></g><line x1="420" y1="134" x2="662" y2="196" stroke="#6b7a94" stroke-width="1.2"/><g class="box"><rect x="576" y="198" width="172" height="84" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="662.0" y="227.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">4  TYPE</text><text x="662.0" y="247.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">NS = Name Server:</text><text x="662.0" y="265.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">who holds the list</text></g><line x1="590" y1="134" x2="844" y2="196" stroke="#6b7a94" stroke-width="1.2"/><g class="box"><rect x="758" y="198" width="172" height="84" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="844.0" y="227.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">5  VALUE</text><text x="844.0" y="247.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">the name server:</text><text x="844.0" y="265.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">a GoDaddy computer</text></g><text x="30" y="322" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">The second row is for the second name server, ns52. Both hold the same list, so if one stops, the other answers.</text><text x="30" y="346" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">1,72,800 seconds ÷ 60 ÷ 60 ÷ 24 = 2 days.</text><text x="30" y="370" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">Verisign has no IP address for codeman.com. It only knows who to ask next.</text><text x="30" y="398" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The same kind of row exists for youtube.com: youtube.com. 172800 IN NS ns1.google.com.</text></svg>
