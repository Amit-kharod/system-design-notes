<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="559" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">One lookup for blog.codeman.com: the phone asks once, the resolver asks three servers</text><g class="box"><rect x="30" y="80" width="150" height="56" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="105.0" y="104.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Your phone</text><text x="105.0" y="124.0" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">192.168.1.5</text></g><g class="box"><rect x="270" y="80" width="190" height="56" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="365.0" y="104.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Resolver</text><text x="365.0" y="124.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">your ISP's, e.g. Jio</text></g><line x1="184" y1="100" x2="266" y2="100" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="266" y1="120" x2="184" y2="120" stroke="#e3262c" stroke-width="2" marker-end="url(#ae3262c)"/><text x="225" y="76" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">1  recursive</text><text x="225" y="150" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e3262c" text-anchor="middle" xml:space="preserve">5  the answer</text><text x="30" y="176" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">The phone asks once and wants the</text><text x="30" y="194" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">whole answer: a recursive query.</text><g class="box"><rect x="270" y="224" width="190" height="58" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="365.0" y="249.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Root server</text><text x="365.0" y="269.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">ICANN's root list</text></g><g class="box"><rect x="490" y="220" width="440" height="66" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="502" y="242" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">asks: which servers hold the .com list?</text><text x="502" y="266" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#243352" text-anchor="start" xml:space="preserve">referral: a to m.gtld-servers.net</text></g><line x1="462" y1="252" x2="488" y2="252" stroke="#6b7a94" stroke-width="2" marker-end="url(#a6b7a94)"/><text x="250" y="256" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">2</text><g class="box"><rect x="270" y="308" width="190" height="58" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="365.0" y="333.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">.com server</text><text x="365.0" y="353.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Verisign</text></g><g class="box"><rect x="490" y="304" width="440" height="66" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="502" y="326" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">asks: which servers hold codeman.com?</text><text x="502" y="350" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#243352" text-anchor="start" xml:space="preserve">referral: ns51 and ns52.domaincontrol.com</text></g><line x1="462" y1="336" x2="488" y2="336" stroke="#6b7a94" stroke-width="2" marker-end="url(#a6b7a94)"/><text x="250" y="340" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">3</text><g class="box"><rect x="270" y="392" width="190" height="58" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="365.0" y="417.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">GoDaddy name server</text><text x="365.0" y="437.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">ns51.domaincontrol.com</text></g><g class="box"><rect x="490" y="388" width="440" height="66" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="502" y="410" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">asks: what is the IP of blog.codeman.com?</text><text x="502" y="434" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11.5" font-weight="800" fill="#e3262c" text-anchor="start" xml:space="preserve">answer: 203.0.113.20, keep for 3,600 s</text></g><line x1="462" y1="420" x2="488" y2="420" stroke="#6b7a94" stroke-width="2" marker-end="url(#a6b7a94)"/><text x="250" y="424" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">4</text><line x1="365" y1="138" x2="365" y2="222" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="365" y1="282" x2="365" y2="306" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="365" y1="366" x2="365" y2="390" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="380" y="190" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f6fa8" text-anchor="start" xml:space="preserve">iterative: one server after another</text><text x="30" y="506" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Each server only points to the next one (a referral). The last one owns the list, so its answer is final: authoritative.</text><text x="30" y="526" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">youtube.com goes the same way, but Verisign's row points to Google's own four name servers, ns1.google.com to ns4.google.com.</text><text x="30" y="546" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The whole walk takes a few milliseconds.</text></svg>
