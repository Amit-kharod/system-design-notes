<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="439" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Who decides which TLDs exist: ICANN and its root list</text><g class="box"><rect x="30" y="96" width="220" height="84" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="140.0" y="125.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">ICANN</text><text x="140.0" y="145.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">non-profit, since 1998</text><text x="140.0" y="163.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">keeps the root list</text></g><line x1="252" y1="138" x2="298" y2="138" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="300" y="66" width="230" height="244" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="415" y="90" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Root list: 1,436 TLDs</text></g><g class="box"><rect x="320" y="106" width="190" height="30" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="415.0" y="125.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">.com</text></g><g class="box"><rect x="320" y="146" width="190" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="415.0" y="165.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">.in</text></g><g class="box"><rect x="320" y="186" width="190" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="415.0" y="205.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">.google</text></g><g class="box"><rect x="320" y="226" width="190" height="30" rx="6" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="415.0" y="245.68" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">.youtube</text></g><text x="415" y="282" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">and 1,432 more, each with</text><text x="415" y="298" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">the servers that hold its list</text><g class="box"><rect x="640" y="70" width="290" height="64" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="785.0" y="89.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Verisign</text><text x="785.0" y="109.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">registry of .com</text><text x="785.0" y="127.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">about 17 crore .com names</text></g><g class="box"><rect x="640" y="150" width="290" height="64" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="785.0" y="169.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">NIXI</text><text x="785.0" y="189.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">registry of .in</text><text x="785.0" y="207.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">National Internet Exchange of India</text></g><g class="box"><rect x="640" y="230" width="290" height="64" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="785.0" y="249.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Google</text><text x="785.0" y="269.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">registry of .google and .youtube</text><text x="785.0" y="287.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">its own TLDs, from the 2012 round</text></g><line x1="512" y1="121" x2="638" y2="102" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="512" y1="161" x2="638" y2="182" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="512" y1="201" x2="638" y2="262" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="512" y1="241" x2="638" y2="276" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="30" y="350" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">A new TLD needs an application to ICANN:</text><g class="box"><rect x="30" y="364" width="440" height="56" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="250.0" y="388.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">2012 round</text><text x="250.0" y="408.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">about 1,930 applications, USD 1,85,000 each</text></g><g class="box"><rect x="490" y="364" width="440" height="56" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="710.0" y="388.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">2026 round</text><text x="710.0" y="408.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">USD 2,27,000 each, about 2 crore rupees</text></g></svg>
