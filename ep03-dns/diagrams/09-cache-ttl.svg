<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="479" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Cache and TTL: the old answer stays for as long as the TTL says</text><line x1="60" y1="200" x2="900" y2="200" stroke="#6b7a94" stroke-width="2"/><line x1="60" y1="194" x2="60" y2="206" stroke="#6b7a94" stroke-width="2"/><text x="60" y="226" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="middle" xml:space="preserve">0 s</text><line x1="480" y1="194" x2="480" y2="206" stroke="#6b7a94" stroke-width="2"/><text x="480" y="226" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="middle" xml:space="preserve">1,800 s</text><line x1="900" y1="194" x2="900" y2="206" stroke="#6b7a94" stroke-width="2"/><text x="900" y="226" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="end" xml:space="preserve">3,600 s = 1 hour</text><rect x="60" y="150" width="840" height="36" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="480" y="173" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">the resolver answers from its cache: it asks nobody</text><circle cx="60" cy="120" r="7" fill="#e3262c"/><text x="76" y="125" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#243352" text-anchor="start" xml:space="preserve">a resolver caches  blog.codeman.com  A  203.0.113.20  (TTL 3600)</text><circle cx="120" cy="90" r="7" fill="#2f6fa8"/><text x="136" y="95" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2f6fa8" text-anchor="start" xml:space="preserve">one second later you switch the record to 203.0.113.30: this resolver does not know yet</text><circle cx="900" cy="120" r="7" fill="#e3262c"/><text x="884" y="125" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="end" xml:space="preserve">expires</text><text x="30" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Until the timer ends, this resolver keeps giving the old address. After it, it asks again and gets the new one.</text><text x="30" y="284" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Other resolvers cached at other moments, so they all switch at different times: that spread is "propagation".</text><text x="30" y="336" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">The same idea for name servers: the 48-hour message</text><line x1="60" y1="408" x2="900" y2="408" stroke="#6b7a94" stroke-width="2"/><line x1="60" y1="402" x2="60" y2="414" stroke="#6b7a94" stroke-width="2"/><text x="60" y="434" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">0</text><line x1="480" y1="402" x2="480" y2="414" stroke="#6b7a94" stroke-width="2"/><text x="480" y="434" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="middle" xml:space="preserve">24 hours</text><line x1="900" y1="402" x2="900" y2="414" stroke="#6b7a94" stroke-width="2"/><text x="900" y="434" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="end" xml:space="preserve">48 hours = 1,72,800 s</text><rect x="60" y="358" width="840" height="36" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="480" y="381" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1a2640" text-anchor="middle" xml:space="preserve">a resolver that cached Verisign's old row may still ask GoDaddy's name servers, not Cloudflare's</text><text x="30" y="462" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">You changed the name servers; Verisign's row has a TTL of 1,72,800 s, so some resolvers use the old row for up to 2 days.</text></svg>
