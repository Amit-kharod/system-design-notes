<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="469" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Delegation: each list points to the next one (blog.codeman.com)</text><g class="box"><rect x="30" y="70" width="240" height="80" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="150.0" y="106.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Root server</text><text x="150.0" y="126.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">ICANN's root list</text></g><line x1="272" y1="110" x2="318" y2="110" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="320" y="70" width="610" height="80" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="336" y="95" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">The root list says:</text><text x="336" y="117" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="800" fill="#243352" text-anchor="start" xml:space="preserve">com.  172800  IN  NS  a.gtld-servers.net.</text><text x="336" y="137" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">(13 rows, a to m)</text></g><g class="box"><rect x="30" y="190" width="240" height="80" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="150.0" y="226.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">.com server</text><text x="150.0" y="246.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Verisign's .com list</text></g><line x1="272" y1="230" x2="318" y2="230" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="320" y="190" width="610" height="80" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="336" y="215" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">The .com list says:</text><text x="336" y="237" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="800" fill="#243352" text-anchor="start" xml:space="preserve">codeman.com.  172800  IN  NS  ns51.domaincontrol.com.</text><text x="336" y="257" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">(2 rows, ns51 and ns52)</text></g><g class="box"><rect x="30" y="310" width="240" height="80" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="150.0" y="346.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">GoDaddy name server</text><text x="150.0" y="366.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">codeman.com's own list</text></g><line x1="272" y1="350" x2="318" y2="350" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><g class="box"><rect x="320" y="310" width="610" height="80" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="336" y="335" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6b7a94" text-anchor="start" xml:space="preserve">The name server says:</text><text x="336" y="357" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="800" fill="#e3262c" text-anchor="start" xml:space="preserve">blog.codeman.com.  3600  IN  A  203.0.113.20</text><text x="336" y="377" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">the real answer, written by the owner</text></g><line x1="150" y1="152" x2="150" y2="188" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="150" y1="272" x2="150" y2="308" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="164" y="175" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f6fa8" text-anchor="start" xml:space="preserve">points to</text><text x="164" y="295" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f6fa8" text-anchor="start" xml:space="preserve">points to</text><text x="30" y="422" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Each level keeps only the next hop. Only the last list holds the address, and its owner (whoever bought the name) wrote it.</text><text x="30" y="444" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">Handing a part of the list to someone else is called delegation. Each part, run by one owner, is a zone.</text></svg>
