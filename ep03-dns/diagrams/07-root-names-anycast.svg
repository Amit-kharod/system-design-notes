, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">NASA</text></g><g class="box"><rect x="680" y="66" width="122" height="76" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="741.0" y="100.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">F</text><text x="741.0" y="120.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">ISC</text></g><g class="box"><rect x="810" y="66" width="122" height="76" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="871.0" y="91.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">G</text><text x="871.0" y="111.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">US Dept of</text><text x="871.0" y="129.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Defense</text></g><g class="box"><rect x="30" y="154" width="122" height="76" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="91.0" y="179.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">H</text><text x="91.0" y="199.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">US Army</text><text x="91.0" y="217.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Research Lab</text></g><g class="box"><rect x="160" y="154" width="122" height="76" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="221.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">I</text><text x="221.0" y="208.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Netnod</text></g><g class="box"><rect x="290" y="154" width="122" height="76" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="351.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">J</text><text x="351.0" y="208.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Verisign</text></g><g class="box"><rect x="420" y="154" width="122" height="76" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="481.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">K</text><text x="481.0" y="208.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">RIPE NCC</text></g><g class="box"><rect x="550" y="154" width="122" height="76" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="611.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">L</text><text x="611.0" y="208.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">ICANN</text></g><g class="box"><rect x="680" y="154" width="122" height="76" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="741.0" y="188.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">M</text><text x="741.0" y="208.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">WIDE Project</text></g><text x="30" y="248" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">The names run from a.root-servers.net to m.root-servers.net. Verisign (shaded) runs two of them, A and J.</text><text x="30" y="276" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Behind each name: many copies of the same list. One address is shared, and the question goes to the nearest copy (anycast).</text><g class="box"><rect x="30" y="292" width="130" height="56" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="95.0" y="316.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Resolver</text><text x="95.0" y="336.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">in Mumbai</text></g><g class="box"><rect x="210" y="292" width="200" height="56" rx="10" fill="#ffffff" stroke="#e3262c" stroke-width="1.4"/><text x="310.0" y="316.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">copy in Mumbai</text><text x="310.0" y="336.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">same address, same list</text></g><g class="box"><rect x="460" y="292" width="200" height="56" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="560.0" y="316.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">copy in Delhi</text><text x="560.0" y="336.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">same address, same list</text></g><g class="box"><rect x="710" y="292" width="200" height="56" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="810.0" y="316.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">copy in Chennai</text><text x="810.0" y="336.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">same address, same list</text></g><line x1="162" y1="320" x2="208" y2="320" stroke="#e3262c" stroke-width="2" marker-end="url(#ae3262c)"/><text x="310" y="366" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e3262c" text-anchor="middle" xml:space="preserve">nearest: answers</text><text x="560" y="366" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6b7a94" text-anchor="middle" xml:space="preserve">farther: not asked</text><text x="810" y="366" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#6b7a94" text-anchor="middle" xml:space="preserve">farther: not asked</text><text x="30" y="400" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">2,046 copies in all (15 Nov 2026), more than 60 of them in India. Why only 13 names: an answer had to fit in 512 bytes.</text><text x="30" y="422" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The .com list works the same way: 13 servers, a.gtld-servers.net to m.gtld-servers.net, all Verisign's, the same copy on each.</text><text x="30" y="444" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">"Nearest" means nearest by internet routing, which is usually, not always, the closest in kilometres.</text></svg>
