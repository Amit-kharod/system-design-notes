<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="469" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">The old way, 1970s and 1980s: one file, HOSTS.TXT, kept in one place</text><g class="box"><rect x="30" y="76" width="230" height="84" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="145.0" y="105.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">A new computer</text><text x="145.0" y="125.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">its owner sends an email:</text><text x="145.0" y="143.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">"please add it to the list"</text></g><g class="box"><rect x="380" y="66" width="290" height="104" rx="10" fill="#ffffff" stroke="#e3262c" stroke-width="1.4"/><text x="525.0" y="96.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">NIC at SRI</text><text x="525.0" y="116.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Network Information Center,</text><text x="525.0" y="134.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">Menlo Park, California</text><text x="525.0" y="152.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">keeps HOSTS.TXT</text></g><g class="box"><rect x="730" y="76" width="200" height="84" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="830.0" y="105.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Every computer</text><text x="830.0" y="125.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">downloads the whole</text><text x="830.0" y="143.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">file again and again</text></g><line x1="262" y1="118" x2="378" y2="118" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="672" y1="118" x2="728" y2="118" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="320" y="106" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">email</text><text x="30" y="204" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">The mailbox for requests was HOSTMASTER@SRI-NIC.ARPA. The file was rebuilt once or twice a week.</text><text x="30" y="240" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Why it broke</text><g class="box"><rect x="30" y="254" width="290" height="58" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="175.0" y="279.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">The file kept growing</text><text x="175.0" y="299.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">as more computers joined</text></g><g class="box"><rect x="340" y="254" width="290" height="58" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="485.0" y="279.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">A new name took days</text><text x="485.0" y="299.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">to reach every computer</text></g><g class="box"><rect x="650" y="254" width="290" height="58" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="795.0" y="279.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Thousands of computers</text><text x="795.0" y="299.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">asked one office for the file</text></g><text x="30" y="352" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">What came next</text><line x1="70" y1="400" x2="890" y2="400" stroke="#6b7a94" stroke-width="2"/><circle cx="110" cy="400" r="7" fill="#2f6fa8"/><text x="110" y="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">1983</text><text x="110" y="424" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#243352" text-anchor="middle" xml:space="preserve">Paul Mockapetris</text><text x="110" y="442" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">designs DNS</text><circle cx="370" cy="400" r="7" fill="#2f6fa8"/><text x="370" y="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">1985</text><text x="370" y="424" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#243352" text-anchor="middle" xml:space="preserve">symbolics.com</text><text x="370" y="442" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">the first .com name</text><circle cx="630" cy="400" r="7" fill="#2f6fa8"/><text x="630" y="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">1990s</text><text x="630" y="424" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#243352" text-anchor="middle" xml:space="preserve">Network Solutions</text><text x="630" y="442" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">sells domain names</text><circle cx="850" cy="400" r="7" fill="#2f6fa8"/><text x="850" y="380" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">1999</text><text x="850" y="424" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#243352" text-anchor="middle" xml:space="preserve">many companies</text><text x="850" y="442" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="middle" xml:space="preserve">GoDaddy, Hostinger ...</text></svg>
