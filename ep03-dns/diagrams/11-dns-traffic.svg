<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img"><defs><style>text{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}</style><marker id="a2f6fa8" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2f6fa8"/></marker><marker id="ae3262c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e3262c"/></marker><marker id="a6b7a94" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#6b7a94"/></marker><marker id="a1a2640" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1a2640"/></marker><marker id="a243352" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#243352"/></marker></defs><rect x="0.5" y="0.5" width="959" height="419" rx="14" fill="#f7f9fc" stroke="#c9d6e6"/><text x="28" y="38" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">DNS can answer by place, rotate the answers, and drop a dead server</text><text x="30" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">By place (youtube.com)</text><g class="box"><rect x="30" y="100" width="170" height="54" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="115.0" y="131.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Resolver in Mumbai</text></g><g class="box"><rect x="30" y="172" width="170" height="54" rx="10" fill="#ffffff" stroke="#c9d6e6" stroke-width="1.4"/><text x="115.0" y="203.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Resolver in Delhi</text></g><g class="box"><rect x="300" y="128" width="190" height="72" rx="10" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="395.0" y="160.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#1a2640" text-anchor="middle" xml:space="preserve">Google name server</text><text x="395.0" y="180.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#243352" text-anchor="middle" xml:space="preserve">looks at who asks</text></g><line x1="202" y1="127" x2="298" y2="150" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><line x1="202" y1="199" x2="298" y2="180" stroke="#2f6fa8" stroke-width="2" marker-end="url(#a2f6fa8)"/><text x="520" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#243352" text-anchor="start" xml:space="preserve">Mumbai gets the address of a Mumbai-side server</text><text x="520" y="156" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#243352" text-anchor="start" xml:space="preserve">Delhi gets the address of a Delhi-side server</text><text x="520" y="184" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6b7a94" text-anchor="start" xml:space="preserve">The name server sees the resolver, not your phone.</text><text x="30" y="272" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#1a2640" text-anchor="start" xml:space="preserve">Rotating and failover (suppose codeman.com has three servers)</text><g class="box"><rect x="30" y="288" width="180" height="36" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="120.0" y="310.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">203.0.113.21</text></g><text x="120" y="344" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">in the answers</text><g class="box"><rect x="230" y="288" width="180" height="36" rx="6" fill="#e6f4fc" stroke="#8fd0f2" stroke-width="1.4"/><text x="320.0" y="310.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#243352" text-anchor="middle" xml:space="preserve">203.0.113.22</text></g><text x="320" y="344" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2f6fa8" text-anchor="middle" xml:space="preserve">in the answers</text><g class="box"><rect x="430" y="288" width="180" height="36" rx="6" fill="#fdeced" stroke="#e3262c" stroke-width="1.4"/><text x="520.0" y="310.5" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#e3262c" text-anchor="middle" xml:space="preserve">203.0.113.23</text></g><text x="520" y="344" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e3262c" text-anchor="middle" xml:space="preserve">removed from the answers</text><text x="640" y="298" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">Each new question gets the next</text><text x="640" y="316" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">address in turn. A health check</text><text x="640" y="334" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">finds the dead one: its address is no</text><text x="640" y="352" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#243352" text-anchor="start" xml:space="preserve">longer given out. Keep the TTL small.</text><text x="30" y="392" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#6b7a94" text-anchor="start" xml:space="preserve">DNS hands out the address once. The requests that follow go straight to that server: DNS does not see each request.</text></svg>
